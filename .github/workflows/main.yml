name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # السطرين التاليين هما الأهم، يخبران النظام بالدخول لمجلد Dr
    defaults:
      run:
        working-directory: ./Dr

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # في حال كان ملف gradle-wrapper.jar مفقوداً كما في المرة السابقة
    - name: Setup Gradle
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # تأكد أن المسار هنا يبدأ بـ Dr أيضاً
        path: Dr/app/build/outputs/apk/debug/app-debug.apk
