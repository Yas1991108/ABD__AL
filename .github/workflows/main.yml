name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Download sherpa-onnx AAR
      working-directory: LamdaAI
      run: |
        mkdir -p app/libs
        curl -fL -o app/libs/sherpa-onnx.aar \
          https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.40/sherpa-onnx-1.12.40.aar
        ls -la app/libs/

    - name: Clone llama.cpp
      run: |
        rm -rf LamdaAI/app/src/main/cpp/llama.cpp
        git clone --depth 1 --branch b4200 https://github.com/ggerganov/llama.cpp LamdaAI/app/src/main/cpp/llama.cpp

    - name: Build APK with Gradle
      run: gradle assembleDebug --no-daemon
      working-directory: LamdaAI

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: LamdaAI/app/build/outputs/apk/debug/app-debug.apk
