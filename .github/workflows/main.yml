name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Dr

    steps:
    - uses: actions/checkout@v4

    # تحديد جافا 17 بدلاً من الإصدارات الأحدث غير المستقرة
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # تثبيت إصدار Gradle محدد (8.5) لضمان التوافق مع أندرويد
    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    # توليد ملفات الـ Wrapper بالإصدار الجديد
    - name: Update Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: Dr/app/build/outputs/apk/debug/app-debug.apk
